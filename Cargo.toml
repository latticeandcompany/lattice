[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/lattice",
    "crates/lattice-cache",
    "crates/lattice-config",
    "crates/dagger",
    "crates/lattice-events",
    "crates/lattice-output",
    "crates/lattice-project",
    "crates/lattice-runner",
    "crates/lattice-testkit",
    "crates/lattice-workspace",
]
resolver = "2"

[workspace.package]
version = "1.0.0-beta-3"
edition = "2021"
# The floor comes from the dependency tree: globset needs 1.88, and the dev tree's
# jsonschema -> idna -> idna_adapter -> icu_* chain needs 1.86.
# Verify with `cargo +<msrv> check --workspace --all-targets` before changing it.
rust-version = "1.88"
authors = ["Ryan Mullin"]
license = "ISC"
publish = false
repository = "https://github.com/latticeandcompany/lattice"
homepage = "https://latticeandcompany.github.io/lattice"
documentation = "https://latticeandcompany.github.io/lattice/docs"
keywords = ["monorepo", "build", "task-runner", "cache", "toolchain"]
categories = [
    "development-tools",
    "development-tools::build-utils",
    "command-line-utilities",
]

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
