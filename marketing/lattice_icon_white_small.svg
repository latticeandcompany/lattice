    <ellipse cx="350" cy="350" rx="250" ry="95" fill="none" stroke="#FBF8FF" stroke-width="10" transform="rotate(22.5 350 350)" id="ellipse2"/>
    <ellipse cx="350" cy="350" rx="250" ry="95" fill="none" stroke="#FBF8FF" stroke-width="10" transform="rotate(45 350 350)" id="ellipse3"/>
    <ellipse cx="350" cy="350" rx="250" ry="95" fill="none" stroke="#FBF8FF" stroke-width="10" transform="rotate(67.5 350 350)" id="ellipse4"/>
    <ellipse cx="350" cy="350" rx="250" ry="95" fill="none" stroke="#FBF8FF" stroke-width="10" transform="rotate(90 350 350)" id="ellipse5"/>
    <ellipse cx="350" cy="350" rx="250" ry="95" fill="none" stroke="#FBF8FF" stroke-width="10" transform="rotate(112.5 350 350)" id="ellipse6"/>
    <ellipse cx="350" cy="350" rx="250" ry="95" fill="none" stroke="#FBF8FF" stroke-width="10" transform="rotate(135 350 350)" id="ellipse7"/>
    <ellipse cx="350" cy="350" rx="250" ry="95" fill="none" stroke="#FBF8FF" stroke-width="10" transform="rotate(157.5 350 350)" id="ellipse8"/>
