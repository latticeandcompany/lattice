name: Release

# A tag is the trigger, and the tree has to agree with it: check-versions.sh
# refuses a tag whose version is not the one written in Cargo.toml, lattice.json
# and Cargo.lock, so a release can never ship a binary that reports a different
# version than the tag it came from.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve the version from the tag
        id: pick
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

      - name: The tree must agree with the tag
        run: scripts/check-versions.sh "${{ steps.pick.outputs.version }}"

  completions:
    name: completions
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Generated once on a native host: a cross-compiled binary cannot be run to
      # print its own completions.
      - name: Generate completion scripts
        run: |
          cargo build --release --locked --bin lattice
          mkdir -p completions
          for shell in bash zsh fish powershell elvish; do
            ./target/release/lattice completions "$shell" >"completions/lattice.$shell"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: completions
          path: completions/

  build:
    name: ${{ matrix.target }}
    needs: [version, completions]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --bin lattice --target ${{ matrix.target }}

      - uses: actions/download-artifact@v4
        with:
          name: completions
          path: completions

      # One archive shape for every platform, including Windows: the installer and
      # the drift check both extract with the same code, and .tar.gz is the format
      # they know. Everything sits under a directory named for the archive, so
      # unpacking it by hand does not scatter files.
      - name: Package
        shell: bash
        run: |
          version='${{ needs.version.outputs.version }}'
          stem="lattice-$version-${{ matrix.target }}"
          exe=''
          if [ '${{ runner.os }}' = 'Windows' ]; then exe='.exe'; fi
          mkdir -p "dist/$stem"
          cp "target/${{ matrix.target }}/release/lattice$exe" "dist/$stem/"
          cp LICENSE "dist/$stem/"
          cp -r completions "dist/$stem/completions"
          tar -czf "$stem.tar.gz" -C dist "$stem"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: lattice-*.tar.gz

  publish:
    name: publish
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: assets
          merge-multiple: true

      # One checksums file covers the whole release: the installer fetches it once
      # and finds the line for the platform it is on.
      - name: Checksum every archive
        working-directory: assets
        run: |
          sha256sum lattice-*.tar.gz >"lattice-${{ needs.version.outputs.version }}-checksums.txt"
          cat "lattice-${{ needs.version.outputs.version }}-checksums.txt"

      # Shipped as an asset as well as from the docs site, so the one-liner has a
      # second, versioned home.
      - name: Include the installer
        run: cp apps/web/public/install.sh assets/install.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ needs.version.outputs.tag }}'
          version='${{ needs.version.outputs.version }}'

          # A semver pre-release (0.2.0-beta.1) ships as a GitHub pre-release, so
          # /releases/latest keeps naming the last stable build — that endpoint is
          # what install.sh and `lattice upgrade` read when nothing pins a version.
          prerelease=()
          case "$version" in
            *-*) prerelease=(--prerelease) ;;
          esac

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" assets/* --clobber
          else
            gh release create "$tag" assets/* \
              --title "$tag" \
              --generate-notes \
              --verify-tag \
              "${prerelease[@]}"
          fi
