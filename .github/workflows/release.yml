name: Release

# A tag is the trigger, and the tree has to agree with it: check-versions.sh
# refuses a tag whose version is not the one written in Cargo.toml, lattice.json
# and Cargo.lock, so a release can never ship a binary that reports a different
# version than the tag it came from.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve the version from the tag
        id: pick
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

      - name: The tree must agree with the tag
        run: scripts/check-versions.sh "${{ steps.pick.outputs.version }}"

  completions:
    name: completions
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Generated once on a native host: a cross-compiled binary cannot be run to
      # print its own completions.
      - name: Generate completion scripts
        run: |
          cargo build --release --locked --bin lattice
          mkdir -p completions
          for shell in bash zsh fish powershell elvish; do
            ./target/release/lattice completions "$shell" >"completions/lattice.$shell"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: completions
          path: completions/

  build:
    name: ${{ matrix.target }}
    needs: [version, completions]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --bin lattice --target ${{ matrix.target }}

      - uses: actions/download-artifact@v8
        with:
          name: completions
          path: completions

      # One archive shape for every platform, including Windows: the installer and
      # the drift check both extract with the same code, and .tar.gz is the format
      # they know. Everything sits under a directory named for the archive, so
      # unpacking it by hand does not scatter files.
      - name: Package
        shell: bash
        run: |
          version='${{ needs.version.outputs.version }}'
          stem="lattice-$version-${{ matrix.target }}"
          exe=''
          if [ '${{ runner.os }}' = 'Windows' ]; then exe='.exe'; fi
          mkdir -p "dist/$stem"
          cp "target/${{ matrix.target }}/release/lattice$exe" "dist/$stem/"
          cp LICENSE "dist/$stem/"
          cp -r completions "dist/$stem/completions"
          tar -czf "$stem.tar.gz" -C dist "$stem"

      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.target }}
          path: lattice-*.tar.gz

  # The desktop app, bundled natively on every platform it ships for. Nothing here
  # is cross-compiled. Tauri's webview is a different implementation per platform,
  # and linuxdeploy cannot build an ARM AppImage from an x86 host, so every row runs
  # on its own hardware. Linux pins 24.04 rather than -latest, so the glibc floor of
  # the .deb, the .rpm and the .AppImage moves only when this file says so.
  desktop:
    name: desktop (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            expect: 1
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            expect: 1
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            expect: 2
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            expect: 3
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            expect: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}

      # Only Linux needs these: macOS has WKWebView in the system and the Windows
      # runners ship the WebView2 runtime.
      - name: Install the webview and bundler dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install the frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      # `tauri build` runs the frontend build itself, through beforeBuildCommand.
      # The tauri CLI passes everything after the second `--` to cargo. That is the
      # only way to get `--locked` in, and a release must not quietly resolve a new
      # dependency. The CLI archives above are built the same way.
      #
      # The bundles are unsigned. There is no Developer ID and no Windows publisher
      # certificate, so no step here reads a signing secret, and the download page
      # tells the reader what their OS will say on first launch.
      - name: Bundle
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
        working-directory: apps/desktop

      # Two names for one file. The versioned name is the archive. The bare name is
      # what the download page links to through /releases/latest/download, which
      # resolves only an exact asset name and so cannot carry a version in it.
      #
      # Tauri names its output after the product and the version, as in
      # Lattice_1.0.0_aarch64.dmg, and spells the architecture differently in each
      # format. So this finds every bundle by globbing its directory rather than by
      # predicting its name.
      - name: Stage the bundles under a stable and a versioned name
        shell: bash
        run: |
          set -eu
          shopt -s nullglob
          version='${{ needs.version.outputs.version }}'
          name='${{ matrix.name }}'
          bundle='target/${{ matrix.target }}/release/bundle'
          mkdir -p staged
          staged=0

          stage() {
            cp "$1" "staged/lattice-desktop-$name$2"
            cp "$1" "staged/lattice-desktop-$version-$name$2"
            staged=$((staged + 1))
            echo "  $(basename "$1")  ->  lattice-desktop-$name$2"
          }

          for f in "$bundle"/dmg/*.dmg; do stage "$f" .dmg; done
          for f in "$bundle"/msi/*.msi; do stage "$f" .msi; done
          for f in "$bundle"/nsis/*-setup.exe; do stage "$f" -setup.exe; done
          for f in "$bundle"/deb/*.deb; do stage "$f" .deb; done
          for f in "$bundle"/rpm/*.rpm; do stage "$f" .rpm; done
          for f in "$bundle"/appimage/*.AppImage; do stage "$f" .AppImage; done

          # If a bundle fails to build without failing the job, the download page is
          # left with a link to an asset name that does not exist, which GitHub
          # answers with a 404. Fail the release here instead.
          if [ "$staged" -ne '${{ matrix.expect }}' ]; then
            echo "staged $staged bundles, expected ${{ matrix.expect }}" >&2
            find "$bundle" -maxdepth 2 -type f >&2 || true
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: staged/

  publish:
    name: publish
    needs: [version, build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: assets
          merge-multiple: true

      # One checksums file covers the whole release: the installer fetches it once
      # and finds the line for the platform it is on.
      - name: Checksum every archive
        working-directory: assets
        run: |
          sha256sum lattice-*.tar.gz >"lattice-${{ needs.version.outputs.version }}-checksums.txt"
          cat "lattice-${{ needs.version.outputs.version }}-checksums.txt"

      # A separate file from the CLI checksums, because install.sh greps that file
      # for its own archive and has no business reading .dmg lines. This lists both
      # names of every bundle: the download page hands out the bare name, the
      # archive keeps the versioned name, and the two are the same bytes.
      - name: Checksum every desktop bundle
        working-directory: assets
        run: |
          sha256sum lattice-desktop-*.dmg lattice-desktop-*.msi lattice-desktop-*.exe \
            lattice-desktop-*.deb lattice-desktop-*.rpm lattice-desktop-*.AppImage \
            >"lattice-desktop-${{ needs.version.outputs.version }}-checksums.txt"
          cat "lattice-desktop-${{ needs.version.outputs.version }}-checksums.txt"

      # Shipped as assets as well as from the docs site, so the one-liners have a
      # second, versioned home. Two of them because Windows has two kinds of shell:
      # install.sh covers Git Bash and WSL2, install.ps1 covers PowerShell.
      - name: Include the installers
        run: |
          cp apps/web/public/install.sh assets/install.sh
          cp apps/web/public/install.ps1 assets/install.ps1

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ needs.version.outputs.tag }}'
          version='${{ needs.version.outputs.version }}'

          # A semver pre-release (0.2.0-beta.1) ships as a GitHub pre-release, so
          # /releases/latest keeps naming the last stable build — that endpoint is
          # what install.sh and `lattice upgrade` read when nothing pins a version.
          prerelease=()
          case "$version" in
            *-*) prerelease=(--prerelease) ;;
          esac

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" assets/* --clobber
          else
            gh release create "$tag" assets/* \
              --title "$tag" \
              --generate-notes \
              --verify-tag \
              "${prerelease[@]}"
          fi
