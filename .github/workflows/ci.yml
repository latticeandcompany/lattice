name: CI

on:
  push:
    branches: [mega]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # The installer is the first thing a new user runs, and it runs under
      # whatever /bin/sh they have.
      - name: Shellcheck the installer
        run: shellcheck --shell=sh apps/web/public/install.sh

      - name: Versions agree everywhere they are written by hand
        run: scripts/check-versions.sh

  # The release matrix publishes a Windows binary, so a Windows build has to be
  # something CI proves rather than something the release job discovers. Shell
  # and PATH handling differ there, and nothing else in this workflow exercises
  # either.
  windows:
    name: build · test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # Everything compiles, which is the regression this job mainly exists to
      # catch: the shell and path handling that differs here is easy to write
      # unix-only and impossible to notice from a unix runner.
      - name: Build
        run: cargo build --workspace --all-targets

      # Not the whole suite. A test that drives a task writes its body as a shell
      # script, and those are POSIX: `cmd` has no `;` separator, its `mkdir` takes
      # no `-p`, and `echo x >> f` appends a trailing space. The suites built on
      # that only mean what they say under `sh`, so what runs here is the crates
      # whose tests are pure logic, plus the CLI's own unit tests. Making the
      # task-driving suites portable is worth doing and is not this job's job.
      - name: Test the platform-independent crates
        run: cargo test -p lattice-config -p lattice-cache -p dagger -p lattice-output --lib

      - name: Test the CLI unit tests
        run: cargo test -p lattice --bins
