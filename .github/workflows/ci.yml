name: CI

on:
  push:
    branches: [mega]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # The installer is the first thing a new user runs, and it runs under
      # whatever /bin/sh they have.
      - name: Shellcheck the installer
        run: shellcheck --shell=sh apps/web/public/install.sh

      - name: Versions agree everywhere they are written by hand
        run: scripts/check-versions.sh
