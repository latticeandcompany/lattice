[package]
name = "lattice-workspace"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lattice workspace discovery, driver detection, and toolchain provisioning"

[dependencies]
lattice-config = { path = "../lattice-config" }
anyhow = "1"
indexmap = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
