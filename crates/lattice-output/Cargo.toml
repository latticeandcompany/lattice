[package]
name = "lattice-output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Lattice terminal output formatting"

[dependencies]
lattice-events = { path = "../lattice-events" }
console = "0.16"
indicatif = "0.18"

[dev-dependencies]
# `in_memory` ships InMemoryTerm, a vt100-backed terminal the reporter can draw
# into, so a test can read the screen a run actually leaves behind.
indicatif = { version = "0.18", features = ["in_memory"] }
