[package]
name = "lattice-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Lattice configuration types and loader"

[dependencies]
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"

[dev-dependencies]
# Default features pull in reqwest for remote `$ref` resolution, which we never
# use and which drags a TLS stack (and a higher MSRV) into the dev tree.
jsonschema = { version = "0.52", default-features = false }
serde_json = "1"
tempfile = "3"
