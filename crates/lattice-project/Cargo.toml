[package]
name = "lattice-project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "One opened Lattice repo, and the pipeline every front end runs against it"

[dependencies]
dagger = { path = "../dagger" }
lattice-cache = { path = "../lattice-cache" }
lattice-config = { path = "../lattice-config" }
lattice-events = { path = "../lattice-events" }
lattice-runner = { path = "../lattice-runner" }
lattice-workspace = { path = "../lattice-workspace" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
lattice-testkit = { path = "../lattice-testkit" }
tempfile = "3"
