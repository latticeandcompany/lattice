[package]
name = "lattice"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Cross-language monorepo task orchestrator"

[[bin]]
name = "lattice"
path = "src/main.rs"

[dependencies]
lattice-config = { path = "../lattice-config" }
lattice-dag = { path = "../lattice-dag" }
lattice-output = { path = "../lattice-output" }
lattice-runner = { path = "../lattice-runner" }
lattice-workspace = { path = "../lattice-workspace" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.15"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
