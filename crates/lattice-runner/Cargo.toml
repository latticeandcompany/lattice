[package]
name = "lattice-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Lattice async task executor"

[dependencies]
lattice-cache = { path = "../lattice-cache" }
lattice-config = { path = "../lattice-config" }
dagger = { path = "../dagger" }
lattice-events = { path = "../lattice-events" }
lattice-workspace = { path = "../lattice-workspace" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
lattice-testkit = { path = "../lattice-testkit" }
tempfile = "3"
indexmap = "2"
serde_json = "1"
