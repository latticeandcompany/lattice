[package]
name = "lattice-runner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lattice async task executor"

[dependencies]
lattice-cache = { path = "../lattice-cache" }
lattice-config = { path = "../lattice-config" }
lattice-dag = { path = "../lattice-dag" }
lattice-output = { path = "../lattice-output" }
lattice-workspace = { path = "../lattice-workspace" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
indexmap = "2"
serde_json = "1"
